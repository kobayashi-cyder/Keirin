      - 'tools/pre_race_readiness.py'
      - 'tests/test_pre_race_readiness.py'
      - '.github/workflows/paper-trade-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Forward ledger tests
        run: python -m unittest discover -s tests -p 'test_paper_ledger.py' -v
      - name: OpenAI advisory bridge tests (no API cost)
        run: python -m unittest discover -s tests -p 'test_api_bridge.py' -v
      - name: Strict preclose snapshot tests
        run: python -m unittest discover -s tests -p 'test_snapshot_ingest.py' -v
      - name: Seven-market probability projection tests
        run: python -m unittest discover -s tests -p 'test_all_markets.py' -v
      - name: Pre-race data readiness and no-leakage tests
        run: python -m unittest discover -s tests -p 'test_pre_race_readiness.py' -v
      - name: Permissioned pre-race CSV intake tests
        run: python -m unittest discover -s tests -p 'test_intake_pre_race.py' -v
      - name: Chronological top-three ranker research tests
        run: python -m unittest discover -s tests -p 'test_train_baseline.py' -v
      - name: Browser odds parser and ten-second polling safety tests
        run: python -m unittest discover -s tests -p 'test_browser_odds_watch.py' -v
      - name: HTML-backed and multiline odds parser tests
        run: python -m unittest discover -s tests -p 'test_odds_html_parser.py' -v
      - name: Local snapshot quality and timestamp audit tests
        run: python -m unittest discover -s tests -p 'test_audit_odds_snapshot.py' -v
      - name: Full 3rentan HTML matrix recovery and ranked crosscheck tests
        run: python -m unittest discover -s tests -p 'test_odds_3rentan_matrix.py' -v
      - name: Real-shape captured odds to research-only shadow report tests
        run: python -m unittest discover -s tests -p 'test_odds_to_shadow.py' -v
      - name: GPT-6 Luna and Discord webhook privacy and dry-run tests
        run: python -m unittest discover -s tests -p 'test_discord_openai_status.py' -v
      - name: Deduplicated local research notices offline tests
        run: python -m unittest discover -s tests -p 'test_auto_discord_research.py' -v
      - name: Forward-only trained pre-race model inference tests
        run: python -m unittest discover -s tests -p 'test_predict_pre_race.py' -v
      - name: Licensed provider CSV alias normalization and prereace gate tests
        run: python -m unittest discover -s tests -p 'test_import_provider_csv.py' -v
      - name: Historical 3rentan point-in-time payout backtest tests
        run: python -m unittest discover -s tests -p 'test_backtest_3rentan.py' -v
      - name: Point-in-time multiview rider/track/video tactical feature tests
        run: python -m unittest discover -s tests -p 'test_build_multiview_features.py' -v
      - name: Local licensed video manifest and frame extraction tests
        run: python -m unittest discover -s tests -p 'test_video_history.py' -v
      - name: Official YouTube race discovery and reviewed link storage tests
        run: python -m unittest discover -s tests -p 'test_youtube_race_search.py' -v
      - name: Browser YouTube annotation and historical feature integrity tests
        run: python -m unittest discover -s tests -p 'test_youtube_annotation_studio.py' -v
      - name: End-to-end synthetic paper settlement test
        run: python -m unittest discover -s tests -p 'test_paper_pipeline.py' -v
