name: Keirin forward paper-trading and OpenAI alert feed
on:
  push:
    branches: [main]
    paths:
      - 'paper_trading/inbox/*.json'
      - 'paper_trading/snapshots/*.json'
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *' # UTC; GitHub schedules may run late or be skipped
permissions:
  contents: write
concurrency:
  group: keirin-paper-ledger
  cancel-in-progress: false
jobs:
  record_score_and_prepare_alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate comparison-only paper tickets from complete fresh snapshots
        run: python paper_trading/snapshot_ingest.py --root paper_trading
      - name: Validate preclose decision, hash-chain and official result inputs; score
        run: python paper_trading/ledger.py sync --root paper_trading
      - name: Create ChatGPT-readable alert feed; API writes commentary only
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-6-luna' }}
        run: python paper_trading/api_bridge.py --root paper_trading
      - name: Commit accepted tickets, score and read-only notifications
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A paper_trading/inbox paper_trading/journal.jsonl paper_trading/summary.json paper_trading/alerts
          if git diff --cached --quiet; then
            echo 'No new paper-trading state.'
            exit 0
          fi
          git commit -m 'Record eligible paper-trading decisions, results and alert feed'
          git push
