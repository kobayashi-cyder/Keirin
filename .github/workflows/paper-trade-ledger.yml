name: Keirin paper-trading ledger
on:
  push:
    paths:
      - 'paper_trading/inbox/*.json'
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *' # UTC; GitHub can delay scheduled runs
permissions:
  contents: write
concurrency:
  group: keirin-paper-ledger
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Append eligible preclose paper tickets and settle confirmed results
        run: python paper_trading/ledger.py sync --root paper_trading
      - name: Persist decisions, settlement and summary
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add paper_trading/journal.jsonl paper_trading/summary.json
          if git diff --cached --quiet; then
            echo 'No new valid paper-ticket events.'
            exit 0
          fi
          git commit -m 'Append time-verified paper-trading events'
          git push
